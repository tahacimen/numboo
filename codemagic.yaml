workflows:
  ios-testflight:
    name: Numboo iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: numboo-app-store-connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tahacimen.numboo
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JavaScript dependencies
        script: |
          # Install under the build user's home directory to avoid Corepack/Yarn shims.
          npm install --prefix "$HOME/.numboo-pnpm" pnpm@11.16.0
          "$HOME/.numboo-pnpm/node_modules/.bin/pnpm" install --frozen-lockfile
      - name: Build web app and sync the iOS project
        script: "$HOME/.numboo-pnpm/node_modules/.bin/pnpm" run ios:sync
      - name: Set a unique iOS build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - name: Apply managed code-signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
